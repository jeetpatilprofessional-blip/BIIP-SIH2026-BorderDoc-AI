  <text x="50" y="430" font-family="Arial" font-size="12" fill="#333"><tspan font-weight="bold">Passport No:</tspan> P<IND12345678</text>
  <text x="400" y="470" font-family="Arial" font-size="11" fill="#ff8800" text-anchor="middle">Scenario 6: Identity Fragmentation - DOB 1991-01-15 (Passport says 1990-01-15)</text>
</svg>