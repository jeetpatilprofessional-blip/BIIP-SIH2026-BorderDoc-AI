<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#ffffff" stroke="#ff8800" stroke-width="3"/>
  <rect x="10" y="10" width="780" height="480" fill="#fff8f0" stroke="#ffccaa" stroke-width="1"/>
  <text x="400" y="50" font-family="Arial" font-size="24" fill="#1a1a2e" text-anchor="middle" font-weight="bold">REPUBLIC OF INDIA</text>
  <text x="400" y="80" font-family="Arial" font-size="18" fill="#1a1a2e" text-anchor="middle">VISA - TOURIST</text>
  <line x1="50" y1="90" x2="750" y2="90" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Barcode area -->
  <rect x="50" y="110" width="300" height="100" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="200" y="165" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">VISA|IND|SCENARIO_6|TOURIST|SINGLE</text>
  <text x="200" y="185" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">[BARCODE]</text>

  <!-- Data fields - CONFLICTING DOB -->
  <text x="50" y="230" font-family="Arial" font-size="12" fill="#333"><tspan font-weight="bold">Visa Number:</tspan> VISA_IND_2024_MNO</text>
  <text x="50" y="255" font-family="Arial" font-size="12" fill="#333"><tspan font-weight="bold">Issuing Country:</tspan> INDIA</text>
  <text x="50" y="280" font-family="Arial" font-size="12" fill="#333"><tspan font-weight="bold">Visa Type:</tspan> TOURIST</text>
  <text x="50" y="305" font-family="Arial" font-size="12" fill="#ff8800"><tspan font-weight="bold">Date of Birth:</tspan> 15 JAN 1991</text>
  <text x="50" y="330" font-family="Arial" font-size="12" fill="#333"><tspan font-weight="bold">Date of Entry:</tspan> 15 JAN 2024</text>
  <text x="50" y="355" font-family="Arial" font-size="12" fill="#333"><tspan font-weight="bold">Date of Expiry:</tspan> 14 JUL 2024</text>
  <text x="50" y="380" font-family="Arial" font-size="12" fill="#333"><tspan font-weight="bold">Number of Entries:</tspan> SINGLE</text>
